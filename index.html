<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="alternate" type="application/rss+xml" title="AI 资讯日报 RSS" href="https://masiqi.github.io/ai-digest/feed.xml">
<link rel="alternate" type="application/rss+xml" title="股票社区声音日报 RSS" href="https://masiqi.github.io/stock-monitor/feed.xml">
<title>小赫日报中心</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --text2:#8b949e; --accent:#58a6ff; --stock:#3fb950; --ai:#bc8cff; --warn:#d29922; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --card:#ffffff; --border:#d0d7de; --text:#1f2328; --text2:#656d76; --accent:#0969da; --stock:#1a7f37; --ai:#8250df; --warn:#9a6700; } }
  * { box-sizing: border-box; }
  body { margin:0 auto; max-width:980px; padding:28px 16px 64px; background:var(--bg); color:var(--text); font:17px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hero { padding:34px 0 26px; border-bottom:1px solid var(--border); margin-bottom:22px; text-align:center; }
  .hero h1 { margin:0 0 8px; font-size:36px; line-height:1.2; }
  .hero p { margin:0; color:var(--text2); }
  .cards { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:14px; margin:22px 0; }
  .quote-panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; margin:20px 0 6px; }
  .quote-head { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:12px; }
  .quote-head h2 { margin:0; font-size:21px; }
  .quote-source { color:var(--text2); font-size:13px; }
  .quote-grid { display:grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap:10px; }
  .quote-card { border:1px solid var(--border); border-radius:12px; padding:12px; min-height:104px; }
  .quote-name { font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .quote-symbol { color:var(--text2); font-size:12px; margin-top:1px; }
  .quote-price { font-size:22px; font-weight:900; margin-top:8px; line-height:1.2; }
  .quote-change { font-size:14px; margin-top:4px; font-weight:800; }
  .quote-up { color:#f85149; }
  .quote-down { color:var(--stock); }
  .quote-flat { color:var(--text2); }
  .quote-error { color:var(--text2); font-size:14px; }
  .card { display:block; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 20px; color:var(--text); }
  .card:hover { text-decoration:none; border-color:var(--accent); }
  .card .kicker { font-size:13px; color:var(--text2); margin-bottom:4px; }
  .card .title { font-size:22px; font-weight:800; margin-bottom:6px; }
  .card .desc { color:var(--text2); font-size:15px; }
  .tabs { display:flex; gap:10px; margin:24px 0 14px; flex-wrap:wrap; }
  .tab { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:9px 15px; cursor:pointer; font:inherit; font-weight:700; }
  .tab[aria-selected="true"] { border-color:var(--accent); box-shadow:0 0 0 3px rgba(88,166,255,.12); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0 14px; color:var(--text2); font-size:14px; }
  .feed-link { font-size:14px; }
  .list { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:15px 17px; }
  .item:hover { border-color:var(--accent); }
  .item-title { display:block; color:var(--text); font-weight:800; font-size:18px; line-height:1.45; }
  .item-title:hover { color:var(--accent); text-decoration:none; }
  .item-meta { color:var(--text2); font-size:13px; margin-top:5px; }
  .item-desc { color:var(--text2); margin-top:8px; font-size:14px; line-height:1.6; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .pager { display:flex; align-items:center; justify-content:center; gap:10px; margin:22px 0 0; }
  .pager button { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:9px; padding:8px 12px; cursor:pointer; font:inherit; }
  .pager button:disabled { opacity:.45; cursor:not-allowed; }
  .status { color:var(--text2); text-align:center; padding:24px; border:1px dashed var(--border); border-radius:14px; }
  .footer { margin-top:42px; padding-top:18px; border-top:1px solid var(--border); text-align:center; color:var(--text2); font-size:13px; }
  @media (max-width:700px) { body { font-size:16px; } .hero h1{font-size:31px;} .cards { grid-template-columns:1fr; } .quote-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toolbar{align-items:flex-start; flex-direction:column;} }
</style>
</head>
<body>
  <header class="hero">
    <h1>小赫日报中心</h1>
    <p>AI 资讯日报与持仓股票社区声音日报。两个栏目独立发布，互不覆盖。</p>
  </header>

  <section class="cards" aria-label="栏目入口">
    <a class="card" href="https://masiqi.github.io/ai-digest/">
      <div class="kicker">AI Digest</div>
      <div class="title">📡 AI 日报</div>
      <div class="desc">工具、开源项目、模型动态与行业解读。</div>
    </a>
    <a class="card" href="https://masiqi.github.io/stock-monitor/">
      <div class="kicker">Stock Monitor</div>
      <div class="title">📈 股票日报</div>
      <div class="desc">持仓相关资讯与社区声音，区分事实、观点和噪音。</div>
    </a>
  </section>

  <section class="quote-panel" aria-label="实时持仓行情">
    <div class="quote-head">
      <h2>📈 实时持仓行情</h2>
      <div class="quote-source" id="quote-time">数据源：东方财富 · 加载中…</div>
    </div>
    <div class="quote-grid" id="quote-grid">
      <div class="quote-error">正在读取行情…</div>
    </div>
  </section>

  <nav class="tabs" aria-label="日报栏目">
    <button class="tab" data-feed="ai" aria-selected="true">📡 AI 日报</button>
    <button class="tab" data-feed="stock" aria-selected="false">📈 股票日报</button>
  </nav>

  <div class="toolbar">
    <div id="feed-title">正在加载 AI 日报…</div>
    <a id="feed-home" class="feed-link" href="https://masiqi.github.io/ai-digest/">进入栏目首页 →</a>
  </div>
  <div id="content" class="status">加载中…</div>
  <div id="pager" class="pager" hidden>
    <button id="prev">上一页</button>
    <span id="page-info"></span>
    <button id="next">下一页</button>
  </div>

  <footer class="footer">Powered by GitHub Pages · AI 与股票栏目由各自 agent 独立更新</footer>

<script>
const PAGE_SIZE = 10;
const feeds = {
  ai: {
    label: '📡 AI 日报',
    home: 'https://masiqi.github.io/ai-digest/',
    feed: 'https://masiqi.github.io/ai-digest/feed.xml',
    fallback: [
      { title: '📡 AI 日报栏目首页', link: 'https://masiqi.github.io/ai-digest/', pubDate: '', description: '进入 AI 日报历史列表。' }
    ]
  },
  stock: {
    label: '📈 股票日报',
    home: 'https://masiqi.github.io/stock-monitor/',
    feed: 'https://masiqi.github.io/stock-monitor/feed.xml',
    fallback: [
      { title: '📈 股票日报栏目首页', link: 'https://masiqi.github.io/stock-monitor/', pubDate: '', description: '进入股票日报历史列表。' },
      { title: '📈 2026-06-30 每日持仓股票社区声音监控', link: 'https://masiqi.github.io/stock-monitor/daily/2026-06-30.html', pubDate: '2026-06-30', description: '今日持仓股票社区声音日报。' }
    ]
  }
};
let currentFeed = 'ai';
let currentPage = 1;
let cache = {};
const holdings = [
  { symbol: 'GOOG', name: 'Alphabet', market: 'us', secid: '105.GOOG', cost: 93.1 },
  { symbol: '000001', name: '平安银行', market: 'cn', secid: '0.000001', cost: 3.724 },
  { symbol: '600019', name: '宝钢股份', market: 'cn', secid: '1.600019', cost: 1.587 },
  { symbol: '601088', name: '中国神华', market: 'cn', secid: '1.601088', cost: -1.368 },
  { symbol: '00336', name: '华宝国际', market: 'hk', secid: '116.00336', cost: null }
];

function text(node, selector) {
  const el = node.querySelector(selector);
  return el ? el.textContent.trim() : '';
}
function cleanDescription(html) {
  const div = document.createElement('div');
  div.innerHTML = html || '';
  return (div.textContent || '').replace(/\s+/g, ' ').trim();
}
function formatDate(value) {
  if (!value) return '';
  const d = new Date(value);
  if (!Number.isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  const m = String(value).match(/\d{4}-\d{2}-\d{2}/);
  return m ? m[0] : String(value).slice(0, 20);
}
async function loadFeed(key) {
  if (cache[key]) return cache[key];
  const cfg = feeds[key];
  try {
    const res = await fetch(cfg.feed + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const xml = new DOMParser().parseFromString(await res.text(), 'application/xml');
    const items = Array.from(xml.querySelectorAll('item')).map(item => ({
      title: text(item, 'title'),
      link: text(item, 'link'),
      pubDate: text(item, 'pubDate'),
      description: cleanDescription(text(item, 'description'))
    })).filter(item => item.title && item.link);
    cache[key] = items.length ? items : cfg.fallback;
  } catch (err) {
    console.warn('feed load failed', key, err);
    cache[key] = cfg.fallback;
  }
  return cache[key];
}
function render(items) {
  const cfg = feeds[currentFeed];
  document.getElementById('feed-title').textContent = cfg.label + ' · 共 ' + items.length + ' 篇';
  const home = document.getElementById('feed-home');
  home.href = cfg.home;
  home.textContent = '进入' + cfg.label.replace(/^..\s*/, '') + '栏目首页 →';

  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);
  const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  const content = document.getElementById('content');
  if (!pageItems.length) {
    content.className = 'status';
    content.textContent = '暂无内容';
  } else {
    content.className = '';
    content.innerHTML = '<ul class="list">' + pageItems.map(item => `
      <li class="item">
        <a class="item-title" href="${item.link}" target="_self">${escapeHtml(item.title)}</a>
        <div class="item-meta">${escapeHtml(formatDate(item.pubDate))}</div>
        ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
      </li>`).join('') + '</ul>';
  }
  const pager = document.getElementById('pager');
  pager.hidden = items.length <= PAGE_SIZE;
  document.getElementById('page-info').textContent = currentPage + ' / ' + totalPages;
  document.getElementById('prev').disabled = currentPage <= 1;
  document.getElementById('next').disabled = currentPage >= totalPages;
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}
async function showFeed(key, page = 1) {
  currentFeed = key;
  currentPage = page;
  document.querySelectorAll('.tab').forEach(btn => btn.setAttribute('aria-selected', String(btn.dataset.feed === key)));
  document.getElementById('content').className = 'status';
  document.getElementById('content').textContent = '加载中…';
  render(await loadFeed(key));
}
document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => showFeed(btn.dataset.feed, 1)));
document.getElementById('prev').addEventListener('click', async () => { currentPage--; render(await loadFeed(currentFeed)); });
document.getElementById('next').addEventListener('click', async () => { currentPage++; render(await loadFeed(currentFeed)); });
showFeed('ai');
loadQuotes();
setInterval(loadQuotes, 60 * 1000);

async function loadQuotes() {
  const grid = document.getElementById('quote-grid');
  const time = document.getElementById('quote-time');
  try {
    // Eastmoney's batch endpoint supports A-shares and HK shares together and
    // permits browser CORS. Yahoo's chart endpoint frequently returns 429 to
    // browser clients, so include Huabao (116.00336) in this stable batch.
    const cnHkUrl = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=0.000001,1.600019,1.601088,116.00336&fields=f12,f14,f2,f3,f4,f18';
    const usUrl = 'https://push2.eastmoney.com/api/qt/stock/get?secid=105.GOOG&fields=f57,f58,f43,f60,f169,f170';
    const [cnHkRes, usRes] = await Promise.allSettled([
      fetch(cnHkUrl, { cache: 'no-store' }),
      fetch(usUrl, { cache: 'no-store' })
    ]);
    const cnHk = cnHkRes.status === 'fulfilled' && cnHkRes.value.ok ? await cnHkRes.value.json() : null;
    const us = usRes.status === 'fulfilled' && usRes.value.ok ? await usRes.value.json() : null;
    if (!cnHk && !us) throw new Error('all quote sources unavailable');
    const rows = [];
    const usData = us && us.data;
    if (usData) rows.push({ symbol: 'GOOG', name: 'Alphabet', price: usData.f43 / 1000, pct: usData.f170 / 100, change: usData.f169 / 1000, prev: usData.f60 / 1000, currency: 'USD' });
    for (const item of (((cnHk || {}).data || {}).diff || [])) {
      rows.push({
        symbol: item.f12,
        name: item.f14,
        price: item.f2,
        pct: item.f3,
        change: item.f4,
        prev: item.f18,
        currency: item.f12 === '00336' ? 'HKD' : 'CNY'
      });
    }
    const bySymbol = Object.fromEntries(rows.map(r => [r.symbol, r]));
    grid.innerHTML = holdings.map(h => renderQuote(h, bySymbol[h.symbol])).join('');
    time.textContent = '数据源：东方财富 · ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    console.warn('quote load failed', err);
    grid.innerHTML = '<div class="quote-error">行情暂不可用。东方财富接口可能临时不可访问或被浏览器拦截。</div>';
    time.textContent = '数据源：东方财富 · 加载失败';
  }
}
function renderQuote(holding, row) {
  if (!row || row.price == null || row.price === '-') {
    return `<div class="quote-card"><div class="quote-name">${escapeHtml(holding.name)}</div><div class="quote-symbol">${escapeHtml(holding.symbol)}</div><div class="quote-error">暂无行情</div></div>`;
  }
  const pct = Number(row.pct || 0);
  const cls = pct > 0 ? 'quote-up' : pct < 0 ? 'quote-down' : 'quote-flat';
  const sign = pct > 0 ? '+' : '';
  const price = Number(row.price).toFixed(holding.market === 'us' ? 2 : 2);
  const change = row.change == null ? '' : ` ${sign}${Number(row.change).toFixed(2)}`;
  const costNote = holding.cost == null ? '成本：未提供' : holding.cost < 0 ? '成本：分红后为负' : `成本：${holding.cost}`;
  return `<div class="quote-card">
    <div class="quote-name">${escapeHtml(holding.name)}</div>
    <div class="quote-symbol">${escapeHtml(holding.symbol)} · ${escapeHtml(row.currency)}</div>
    <div class="quote-price ${cls}">${price}</div>
    <div class="quote-change ${cls}">${sign}${pct.toFixed(2)}%${escapeHtml(change)}</div>
    <div class="quote-symbol">${escapeHtml(costNote)}</div>
  </div>`;
}
</script>
</body>
</html>
